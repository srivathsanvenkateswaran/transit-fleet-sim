services:
  fleet-sim:
    build: .
    image: transit-fleet-sim:local
    env_file:
      - path: .env
        required: false
    environment:
      PORT: ${PORT:-8080}
      HOST: ${HOST:-0.0.0.0}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      GTFS_SOURCE: ${GTFS_SOURCE:-bundled}
      GTFS_BUNDLE_PATH: ${GTFS_BUNDLE_PATH:-./data/bundle}
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://'+process.env.HOST+':'+process.env.PORT+'/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped
